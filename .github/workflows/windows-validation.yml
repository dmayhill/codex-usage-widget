name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test and package (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.1"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q codex_usage_widget.py tests

      - name: Set up uv for packaging smoke test
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"

      - name: Build standalone executable
        shell: pwsh
        run: .\scripts\build-exe.ps1

      - name: Verify packaging smoke test
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "dist\CodexUsageWidget.exe"
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              throw "Packaging smoke test did not produce $output."
          }
          if ((Get-Item -LiteralPath $output).Length -le 0) {
              throw "Packaging smoke test produced an empty executable: $output"
          }
